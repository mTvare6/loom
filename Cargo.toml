[package]
name = "saq"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
default-run = "saqd"

[workspace]
members = ["crates/saq-dsp", "crates/saq-ipc", "crates/saq-pipewire"]
resolver = "3"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
tracing-appender = "0.2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
directories = "6.0.0"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
saq-dsp = { path = "crates/saq-dsp" }
saq-pipewire = { path = "crates/saq-pipewire" }
saq-ipc = { path = "crates/saq-ipc" }
signal-hook = "0.3.18"
