[package]
name = "loom"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace]
members = ["crates/loom-dsp", "crates/loom-pipewire"]
resolver = "3"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
loom-dsp = { path = "crates/loom-dsp" }
loom-pipewire = { path = "crates/loom-pipewire" }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
